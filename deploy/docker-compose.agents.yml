# Multi-agent overlay (OpenCode + Cursor CLI). Apply ON TOP of the base file:
#
#   docker compose \
#     -f deploy/docker-compose.yml \
#     -f deploy/docker-compose.agents.yml \
#     up -d
#
# Result: both `opencode-cli` and `cursor-agent` are on PATH, so the user picks
# either one in the web UI / `od` CLI at run time.
#
# IMPORTANT: an image built from deploy/Dockerfile.agents is NOT offline.
# cursor-agent routes through Cursor's cloud (api2.cursor.sh). If you need a
# locked-down deployment, enforce the allow-list at the host/proxy layer.

name: open-design

services:
  open-design:
    image: ${OPEN_DESIGN_AGENTS_IMAGE:-open-design:agents-0.27.2}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agents
      args:
        OPEN_DESIGN_AGENTS_BASE_IMAGE: ${OPEN_DESIGN_AGENTS_BASE_IMAGE:-open-design:base-0.27.2}
        OPENCODE_VERSION: ${OPENCODE_VERSION:-1.19.6}
        APT_MIRROR: ${APT_MIRROR:-}
    environment:
      # Cursor CLI authentication for headless/container use. cursor-agent
      # reads CURSOR_API_KEY automatically. Generate a User API key from
      # Cursor Dashboard -> API Keys (a Service Account key also works).
      # Leave blank to keep cursor-agent visible-but-unauthenticated.
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
